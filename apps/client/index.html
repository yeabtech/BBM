<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10141d" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>BBM — Private Lobby</title>
  </head>
  <body>
    <main id="app">
      <div id="lobby-root"></div>
      <section id="game-root" hidden>
        <a
          id="game-lobby-link"
          class="game-lobby-link"
          href="./"
          aria-label="Return to private lobby"
          >← Lobby</a
        >
        <div
          id="game"
          aria-label="BBM single-player platforming test level"
        ></div>
        <section id="touch-controls" aria-label="Touch movement controls">
          <button type="button" data-control="left" aria-label="Move left">
            ◀
          </button>
          <button type="button" data-control="right" aria-label="Move right">
            ▶
          </button>
          <button type="button" data-control="jump" aria-label="Jump">
            JUMP
          </button>
        </section>
        <section
          id="orientation-prompt"
          class="orientation-prompt"
          aria-labelledby="orientation-title"
          aria-live="polite"
        >
          <div class="orientation-card">
            <span class="orientation-icon" aria-hidden="true">↻</span>
            <h2 id="orientation-title">Turn your phone sideways</h2>
            <p id="orientation-message">
              Landscape mode gives you more room to play.
            </p>
            <button id="orientation-action" type="button">
              Try landscape mode
            </button>
            <button id="orientation-back" class="secondary" type="button">
              Back to lobby
            </button>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
